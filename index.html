<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Heist</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font:17px system-ui,sans-serif;min-height:100vh}body:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(125deg,transparent 0 75px,#ffffff09 76px 78px),linear-gradient(145deg,#d90027 0 28%,#101010 28% 75%,#99001b 75%);z-index:-1}header{display:flex;justify-content:space-between;align-items:center;padding:18px;gap:12px}header b{letter-spacing:3px}main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(50px,12vw,100px);line-height:.8;letter-spacing:-5px;font-style:italic;text-shadow:5px 5px #e00028;margin:30px 0;transform:rotate(-4deg)}h2{font-size:32px;font-style:italic;text-transform:uppercase}button{font: bold 17px system-ui;border:2px solid white;background:#111;color:white;padding:13px 18px;cursor:pointer;box-shadow:4px 4px #e00028;transition:.15s}button:hover,button:focus-visible{background:white;color:#111;transform:translate(-2px,-2px)}button.selected{background:#e00028;color:white}nav{display:grid;gap:15px;max-width:480px}nav button{text-align:left;font-size:24px;transform:skew(-5deg)}.panel{background:#111e;border:3px solid white;padding:22px;box-shadow:8px 8px #d90027;margin:20px 0}.choices{display:grid;gap:12px}.choices button{text-align:left}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.muted{color:#ccc;font-size:14px}.tag{background:white;color:black;padding:5px 10px;font-weight:900}input{max-width:100%;accent-color:#e00028}progress{width:100%;accent-color:#e00028}#hint{border-left:4px solid #e00028;padding:12px;background:#292929}footer{padding:20px;text-align:center;color:#ccc;font-size:12px}button:disabled{opacity:.4;cursor:default}label{display:block;margin:15px 0} </style><header><b>◆ PHYSICS HEIST</b><button onclick="go('settings')">⚙ SETTINGS</button></header><main id="app"><span class="tag">THE EXAM IS YOUR PALACE</span><h1>PHYSICS<br>HEIST</h1><p>Steal the score. Master the laws.</p><nav><button onclick="go('missions')">01 / MISSION SELECT</button><button onclick="start(Q.map((_,i)=>i))">02 / BATTLE MODE</button><button onclick="go('progress')">03 / CONFIDANT</button><button onclick="go('flags')">04 / MEMENTOS</button></nav><p class="muted" id="diagnostic">Interactive engine has not started. If this message remains, open in a browser that supports JavaScript rather than a file preview.</p></main><footer>V0.4 / ORIGINAL PRACTICE QUESTIONS / NO ANSWER REVEALS</footer><audio id="music" loop preload="auto" playsinline></audio><script>
const Q=[['Mechanics','วัตถุเริ่มจากหยุดนิ่ง มีความเร่งคงตัว 3 m/s² เป็นเวลา 4 s วัตถุเคลื่อนที่ได้ระยะทางเท่าใด',['12 m','18 m','24 m','36 m'],'ใช้สมการการกระจัดเมื่อความเร่งคงตัว'],['Mechanics','วัตถุมวล 2 kg เคลื่อนที่ด้วยอัตราเร็ว 5 m/s มีพลังงานจลน์เท่าใด',['10 J','25 J','50 J','5 J'],'พลังงานจลน์ขึ้นกับกำลังสองของอัตราเร็ว'],['Waves','คลื่นมีความถี่ 20 Hz และความยาวคลื่น 0.5 m อัตราเร็วคลื่นเท่าใด',['5 m/s','10 m/s','20 m/s','40 m/s'],'เชื่อมโยงความถี่กับความยาวคลื่น'],['Electricity','ตัวต้านทาน 6 Ω และ 3 Ω ต่อขนานกัน ความต้านทานรวมเท่าใด',['2 Ω','3 Ω','9 Ω','18 Ω'],'ใช้ผลรวมของส่วนกลับความต้านทาน'],['Thermodynamics','แก๊สอุดมคติในภาชนะปริมาตรคงตัว มีอุณหภูมิสัมบูรณ์เพิ่มเป็นสองเท่า ความดันเปลี่ยนอย่างไร',['ลดครึ่งหนึ่ง','คงเดิม','เพิ่มสองเท่า','เพิ่มสี่เท่า'],'พิจารณาสมการ PV = nRT'],['Modern Physics','โฟตอนที่มีความถี่สูงขึ้นจะมีพลังงานเปลี่ยนอย่างไร',['ลดลง','เพิ่มขึ้น','คงเดิม','ขึ้นกับมวลโฟตอน'],'พิจารณาความสัมพันธ์ของพลังงานกับความถี่'],['Optics','แสงเดินทางจากอากาศเข้าสู่แก้ว ความถี่ของแสงเปลี่ยนอย่างไร',['เพิ่มขึ้น','ลดลง','คงเดิม','เป็นศูนย์'],'ความถี่ถูกกำหนดโดยแหล่งกำเนิด'],['Fluids','จุดสองจุดในของเหลวชนิดเดียวกันที่อยู่นิ่ง จุดที่ลึกกว่ามีความดันอย่างไร',['มากกว่า','น้อยกว่า','เท่ากันเสมอ','เป็นศูนย์'],'พิจารณาความดันเนื่องจากความลึก']];
let S={a:{},f:{},i:0};try{Object.assign(S,JSON.parse(localStorage.getItem('heist-v1')||'{}'))}catch(e){}let mode='home',pool=Q.map((_,i)=>i),ctx,vol=.25;const app=document.querySelector('#app'),music=document.querySelector('#music');try{music.volume=.4}catch(e){}let trackName='',trackURL='',audioStatus='No track loaded',dbPromise;function db(){return dbPromise||(dbPromise=new Promise((resolve,reject)=>{let r=indexedDB.open('heist-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}function status(t){audioStatus=t;let el=document.getElementById('audioStatus');if(el)el.textContent=t;let name=document.getElementById('trackName');if(name)name.textContent=trackName||'No track loaded'}function loadTrack(file,name){music.pause();if(trackURL)URL.revokeObjectURL(trackURL);trackURL=URL.createObjectURL(file);music.src=trackURL;trackName=name;music.load();status('Track ready. Tap PLAY BGM.')}async function playBGM(){if(!trackURL){status('Import a track first.');return}try{await music.play();status('Playing • '+trackName)}catch(e){status('Playback failed: '+e.message+' — tap PLAY BGM again.')}}async function importTrack(input){let f=input.files[0];if(!f)return;loadTrack(f,f.name);playBGM();try{let d=await db();await new Promise((resolve,reject)=>{let t=d.transaction('tracks','readwrite');t.objectStore('tracks').put({file:f,name:f.name},'bgm');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)});let el=document.getElementById('storageStatus');if(el)el.textContent='Saved on this device.'}catch(e){let el=document.getElementById('storageStatus');if(el)el.textContent='Could not save locally: '+e.message}}async function restoreTrack(){try{let d=await db();let r=d.transaction('tracks').objectStore('tracks').get('bgm');r.onsuccess=()=>{if(r.result&&!trackURL){loadTrack(r.result.file,r.result.name);let el=document.getElementById('storageStatus');if(el)el.textContent='Restored from device storage.'}}}catch(e){}}music.addEventListener('error',()=>status('Audio error: '+(music.error?.message||'File could not be decoded.')));restoreTrack();function save(){try{localStorage.setItem('heist-v1',JSON.stringify(S))}catch(e){}}function sound(kind='menu'){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!vol)return;let t=ctx.currentTime;function tone(type,f1,f2,d,amp,delay=0){let o=ctx.createOscillator(),g=ctx.createGain(),p=t+delay;o.type=type;o.frequency.setValueAtTime(f1,p);o.frequency.exponentialRampToValueAtTime(f2,p+d);g.gain.setValueAtTime(.0001,p);g.gain.linearRampToValueAtTime(amp*vol,p+.002);g.gain.exponentialRampToValueAtTime(.0001,p+d);o.connect(g);g.connect(ctx.destination);o.start(p);o.stop(p+d+.005)}function snap(d,amp,f,delay=0){let n=Math.ceil(ctx.sampleRate*d),buf=ctx.createBuffer(1,n,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buf;filter.type='bandpass';filter.frequency.value=f;filter.Q.value=.8;g.gain.value=amp*vol;src.connect(filter);filter.connect(g);g.connect(ctx.destination);src.start(t+delay)}if(kind==='answer'){snap(.035,.65,3200);tone('square',780,420,.045,.13);snap(.045,.55,2400,.045);tone('triangle',1250,690,.065,.23,.045)}else if(kind==='next'){snap(.11,.65,1900);tone('sawtooth',240,1300,.075,.09);tone('triangle',1100,480,.045,.16,.075)}else if(kind==='back'){snap(.04,.5,2200);tone('square',950,260,.075,.12)}else if(kind==='hint'){snap(.025,.35,3500);tone('triangle',880,880,.075,.22);tone('triangle',1320,1320,.11,.2,.065)}else{snap(.038,.8,3600);tone('square',1250,650,.027,.12);tone('triangle',620,290,.055,.25)}}catch(e){}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let k=b.textContent.trim();sound(b.closest('.choices')?'answer':k==='HINT'?'hint':/^(NEXT|FINISH)$/.test(k)?'next':/^(BACK|MENU|PREV)$/.test(k)?'back':'menu')},true);function go(m){mode=m;render()}function start(p){pool=p;S.i=0;go('battle')}function render(){let n=Object.keys(S.a).length;if(mode==='home'){app.innerHTML=`<span class="tag">THE EXAM IS YOUR PALACE</span><h1>PHYSICS<br>HEIST</h1><p>Steal the score. Master the laws.</p><nav><button onclick="go('missions')">01 / MISSION SELECT</button><button onclick="start(Q.map((_,i)=>i))">02 / BATTLE MODE</button><button onclick="go('progress')">03 / CONFIDANT</button><button onclick="go('flags')">04 / MEMENTOS</button></nav><p class="muted">V0.5 • DEMO BUILD • ${n}/${Q.length} answered</p>`}else if(mode==='missions'){app.innerHTML=`<h2>Mission Select</h2><nav>${[...new Set(Q.map(q=>q[0]))].map(t=>`<button onclick="start(Q.map((q,i)=>q[0]==='${t}'?i:-1).filter(i=>i>=0))">${t}</button>`).join('')}</nav><p><button onclick="go('home')">BACK</button></p>`}else if(mode==='battle'){let id=pool[S.i]??pool[0],q=Q[id];if(!q){go('flags');return}app.innerHTML=`<div class="bar"><span class="tag">${q[0]}</span><span>QUESTION ${S.i+1} / ${pool.length}</span></div><progress value="${pool.filter(i=>S.a[i]!==undefined).length}" max="${pool.length}"></progress><section class="panel"><h2 style="font-size:18px">TARGET ${String(id+1).padStart(2,'0')}</h2><p lang="th">${q[1]}</p><div class="choices">${q[2].map((c,j)=>`<button class="${S.a[id]===j?'selected':''}" onclick="S.a[${id}]=${j};save();render()">${'ABCD'[j]} / ${c}</button>`).join('')}</div><p id="hint" hidden lang="th">${q[3]}</p></section><div class="bar"><button onclick="document.querySelector('#hint').hidden=false">HINT</button><button onclick="S.f[${id}]=!S.f[${id}];save();render()">${S.f[id]?'UNFLAG':'FLAG'}</button><button onclick="S.i--;render()" ${S.i===0?'disabled':''}>PREV</button><button onclick="${S.i===pool.length-1?"go('progress')":"S.i++;render()"}">${S.i===pool.length-1?'FINISH':'NEXT'}</button><button onclick="go('home')">MENU</button></div>`}else if(mode==='progress'){app.innerHTML=`<h2>Confidant / Progress</h2><div class="panel"><h1 style="font-size:65px">${n}/${Q.length}</h1><progress value="${n}" max="${Q.length}"></progress><p>Questions answered. Accuracy is hidden.</p></div><button onclick="go('home')">MENU</button>`}else if(mode==='flags'){let p=Q.map((_,i)=>i).filter(i=>S.f[i]||S.a[i]===undefined);app.innerHTML=`<h2>Mementos</h2><div class="panel">${p.length} flagged or unanswered questions.</div><button ${p.length?'':'disabled'} onclick="start(Q.map((_,i)=>i).filter(i=>S.f[i]||S.a[i]===undefined))">REVISIT</button> <button onclick="go('home')">MENU</button>`}else{app.innerHTML=`<h2>Settings</h2><div class="panel"><b>BGM / Beneath the Mask -rain, instrumental-</b><p class="muted">Import once; saved locally when browser storage is available. Tap PLAY BGM after reopening the website.</p><p id="trackName"></p><input type="file" onchange="importTrack(this)"><p id="audioStatus" class="muted"></p><p id="storageStatus" class="muted"></p><p class="bar"><button onclick="playBGM()">PLAY BGM</button><button onclick="music.pause();status('Paused')">PAUSE</button></p><label>BGM volume <input type="range" min="0" max="1" step=".05" value="${music.volume}" oninput="music.volume=+this.value"></label><label>SFX volume <input type="range" min="0" max="1" step=".05" value="${vol}" oninput="vol=+this.value"></label></div><button onclick="go('home')">MENU</button>`;status(audioStatus)}}try{render()}catch(e){document.getElementById("diagnostic").textContent="Startup error: "+e.message}</script></html>
